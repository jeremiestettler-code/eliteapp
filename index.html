<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./images/icon-192.png" />
  <title>Programme Force</title>

  <style>
    :root{
      --bg:#0b0f17; --card:#121a29; --muted:#9fb0c7; --text:#eaf1ff;
      --accent:#4ea1ff; --accent2:#00d4ff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 24px;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:var(--bg);
      color:var(--text);
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior:none;
    }

    .app{max-width:520px;margin:0 auto;padding:10px 14px}

    /* =====================
       WORKOUT HEADER
       ===================== */
    .workoutHeader{
      display:flex;
      align-items:center;
      gap:8px;
      padding:6px 2px 4px;
    }
    .workoutBack{
      width:44px;height:44px;border-radius:14px;
      background:#1a2740;color:#fff;border:0;
    }
    .workoutHeaderCenter{
      flex:1;text-align:center;line-height:1.1;
    }
    .workoutTitle{
      font-size:24px;font-weight:950;
    }
    .workoutSub{
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    .workoutChips{
      display:flex;
      justify-content:center;
      gap:8px;
      margin-bottom:6px;
    }
    .chip{
      padding:7px 12px;
      border-radius:999px;
      font-size:13px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
    }

    /* =====================
       WORKOUT LAYOUT
       ===================== */
    #screenWorkout{
      padding-top:0;
      padding-bottom:calc(96px + var(--safe-bot));
    }

    .cardTight{
      width:100%;
      margin-bottom:5px;
      border-radius:var(--radius);
      background:var(--card);
      border:1px solid rgba(255,255,255,.10);
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.03),
        0 10px 28px rgba(0,0,0,.35);
    }

    /* =====================
       GIF CARD
       ===================== */
    .previewCard{
      position:relative;
      overflow:hidden;
    }
    .previewCard img{
      width:100%;
      height:min(280px,34vh);
      object-fit:contain;
      background:#fff;
      display:block;
    }
    .loadBadge{
      position:absolute;
      left:10px;
      bottom:10px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(0,0,0,.45);
      font-weight:900;
      font-size:14px;
    }

    /* =====================
       TODO CARD
       ===================== */
    .todoCard{padding:12px}
    .todoHdr{
      display:flex;
      justify-content:space-between;
      align-items:center;
    }
    .todoLabel{font-weight:900}
    .todoMain{
      margin-top:6px;
      font-size:30px;
      font-weight:950;
    }
    .todoDesc{
      margin-top:4px;
      font-size:13px;
      color:var(--muted);
    }

    /* =====================
       TIMER
       ===================== */
    .timerCard{padding:10px}
    .time{
      text-align:center;
      font-size:56px;
      font-weight:950;
      font-variant-numeric: tabular-nums;
    }

    /* =====================
       BOTTOM CONTROLS
       ===================== */
    .btnbar{
      position:fixed;
      left:0;right:0;bottom:0;
      display:flex;
      gap:12px;
      padding:10px 14px calc(10px + var(--safe-bot));
      background:linear-gradient(180deg, rgba(0,0,0,0), var(--bg) 40%);
    }
    .ctrlBtn{
      flex:1;
      height:54px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.08);
      font-size:18px;
      font-weight:900;
      color:#fff;
    }
    .ctrlBtn.primary{
      background:linear-gradient(180deg,#1b6cff,#0d3f7a);
    }
  </style>
</head>

<body>
<div class="app">

<section id="screenWorkout">

  <!-- HEADER -->
  <div class="workoutHeader">
    <button class="workoutBack">←</button>
    <div class="workoutHeaderCenter">
      <div class="workoutTitle">Pompes</div>
      <div class="workoutSub">Exercice 1/6</div>
    </div>
  </div>

  <div class="workoutChips">
    <div class="chip">Travail</div>
  </div>

  <!-- GIF -->
  <div class="cardTight previewCard">
    <img src="./images/pompes.gif" alt="">
    <div class="loadBadge">2x16</div>
  </div>

  <!-- A FAIRE -->
  <div class="cardTight todoCard">
    <div class="todoHdr">
      <div class="todoLabel">À faire</div>
    </div>
    <div class="todoMain">4 × 12</div>
    <div class="todoDesc">Gainage, amplitude complète</div>
  </div>

  <!-- TIMER -->
  <div class="cardTight timerCard">
    <div class="time">00:45</div>
  </div>

</section>

<!-- CONTROLS -->
<div class="btnbar">
  <button class="ctrlBtn">◀◀</button>
  <button class="ctrlBtn primary">▶︎</button>
  <button class="ctrlBtn">▶▶</button>
</div>

</div>
</body>
</html>
