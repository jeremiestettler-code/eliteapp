<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b0f17" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./images/icon-192.png" />
  <title>Programme Force</title>

  <style>
    :root{
      --bg:#0b0f17; --card:#121a29; --muted:#9fb0c7; --text:#eaf1ff;
      --accent:#4ea1ff; --accent2:#00d4ff; --danger:#ff4e6a;
      --btn:#1a2740; --btn2:#223454;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
      --radius: 20px;
      --safe-top: env(safe-area-inset-top);
      --safe-bot: env(safe-area-inset-bottom);
    }
    [data-theme="light"]{
      --bg:#f5f7fb; --card:#ffffff; --muted:#4f6076; --text:#0b1526;
      --accent:#1976ff; --accent2:#0aa3c2;
      --btn:#e9eef9; --btn2:#dde7fb;
      --shadow: 0 10px 30px rgba(10,20,40,.12);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background:var(--bg);
      color:var(--text);
      -webkit-tap-highlight-color: transparent;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bot);
      overscroll-behavior: none;
      touch-action: manipulation;
    }
    .app{max-width:520px;margin:0 auto; padding:14px 14px 20px}
    .topbar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px}
    .brand{display:flex; flex-direction:column; gap:2px}
    .brand .title{font-size:18px; font-weight:800}
    .brand .sub{font-size:12px; color:var(--muted)}
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px;
      background:var(--card); box-shadow: var(--shadow);
      font-size:13px; color:var(--muted);
    }
    .pill button{border:0; background:transparent; color:var(--text); font-size:14px; font-weight:700}

    .card{background:var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding:14px}
    .stack{display:flex; flex-direction:column; gap:12px}
    .row{display:flex; gap:10px; align-items:center}
    .grow{flex:1}
    .muted{color:var(--muted)}
    .h1{font-size:22px; font-weight:900; margin:0 0 4px}
    .h2{font-size:16px; font-weight:900; margin:0}
    .small{font-size:12px}

    .btn{
      border:0; border-radius: 16px;
      background:var(--btn);
      color:var(--text);
      padding:12px 14px;
      font-weight:800;
      box-shadow: var(--shadow);
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
    }
    .btn:active{transform: translateY(1px)}
    .btn.primary{background: linear-gradient(135deg, var(--accent), var(--accent2)); color:#061224}
    .btn.secondary{background:var(--btn2)}
    .btn.wide{width:100%}
    .btn.icon.big{width:64px; height:64px; padding:0; border-radius:22px}

    .grid{display:grid; grid-template-columns:1fr; gap:12px}
    .sessionItem{display:flex; gap:12px; align-items:center}
    .badge{
      font-size:12px; color:var(--muted);
      background: rgba(255,255,255,.06);
      padding:6px 10px; border-radius:999px;
    }
    [data-theme="light"] .badge{background: rgba(10,20,40,.06)}

    .screen{display:none}
    .screen.active{display:block}

    input{
      width:100%;
      border:0; outline:none;
      background:var(--btn2);
      color:var(--text);
      padding:12px 14px;
      border-radius:16px;
      font-size:15px;
    }

    .preview{
      width:100%;
      border-radius: var(--radius);
      overflow:hidden;
      background: rgba(255,255,255,.06);
      box-shadow: var(--shadow);
    }
    [data-theme="light"] .preview{background: rgba(10,20,40,.06)}
    .preview img{width:100%; height:auto; display:block}

    .timerBox{
      display:flex; flex-direction:column; gap:10px;
      align-items:center; justify-content:center;
      padding: 14px;
    }
    .phase{
      font-weight:900; letter-spacing:.3px;
      padding:8px 12px; border-radius:999px;
      background: rgba(255,255,255,.08);
      font-size:12px;
    }
    [data-theme="light"] .phase{background: rgba(10,20,40,.06)}
    .time{
      font-variant-numeric: tabular-nums;
      font-size: 62px;
      font-weight: 950;
      line-height: 1;
      margin: 2px 0 0;
    }

    .btnbar{
      position: sticky;
      bottom: 0;
      padding: 12px 0 calc(12px + var(--safe-bot));
      background: linear-gradient(180deg, rgba(0,0,0,0), var(--bg) 42%);
      display:flex; justify-content:center; gap:14px;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="title">Programme Force</div>
        <div class="sub" id="userLine">Non connecté</div>
      </div>
      <div class="pill">
        <span id="pillStatus">🔒</span>
        <button id="btnLogout" style="display:none">Déconnexion</button>
      </div>
    </div>

    <!-- LOGIN -->
    <section class="screen active" id="screenLogin">
      <div class="card">
        <div class="h1">Connexion</div>
        <div class="muted small">
          Après connexion : lecture Firestore <code>users/{uid}/profile/config</code> puis chargement de <code>sessionsFile</code>.
        </div>
        <div style="height:12px"></div>
        <div class="stack">
          <input id="loginEmail" type="email" autocomplete="username" placeholder="Email" />
          <input id="loginPass" type="password" autocomplete="current-password" placeholder="Mot de passe" />
          <button class="btn primary wide" id="btnLogin">Se connecter</button>
          <div class="muted small" id="loginMsg"></div>
        </div>
      </div>
    </section>

    <!-- HOME -->
    <section class="screen" id="screenHome">
      <div class="card">
        <div class="row">
          <div class="grow">
            <div class="h1">Séances</div>
            <div class="muted small" id="homeHint">—</div>
          </div>
          <button class="btn secondary" id="btnTheme" title="Thème">🌓</button>
        </div>
        <div style="height:12px"></div>
        <div class="grid" id="sessionList"></div>
      </div>
    </section>

    <!-- WORKOUT -->
    <section class="screen" id="screenWorkout">
      <div class="card">
        <div class="row">
          <button class="btn secondary" id="btnBackHome">←</button>
          <div class="grow">
            <div class="h2" id="workoutTitle">Séance</div>
            <div class="muted small" id="workoutSubtitle">—</div>
          </div>
          <span class="badge" id="setBadge">—</span>
        </div>

        <div style="height:12px"></div>
        <div class="preview">
          <img id="exoImg" alt="Exercice" />
        </div>

        <div style="height:12px"></div>
        <div class="h1" id="exoName">—</div>
        <div class="muted small" id="exoDesc">—</div>

        <div style="height:12px"></div>
        <div class="timerBox">
          <div class="phase" id="phasePill">PRÊT</div>
          <div class="time" id="timeText">00:00</div>
          <div class="muted small" id="phaseHint">Appuie sur ▶︎</div>
        </div>
      </div>

      <div class="btnbar">
        <button class="btn icon big secondary" id="btnPrev" title="Précédent">⏪</button>
        <button class="btn icon big primary" id="btnPlayPause" title="Start / Pause">▶︎</button>
        <button class="btn icon big secondary" id="btnNext" title="Suivant">⏩</button>
      </div>
    </section>
  </div>

  <!-- mapping icons -> paths -->
  <script src="./images.js"></script>

  <script type="module">
    /*************************
     * Firebase
     *************************/
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // ✅ Ta config Firebase (fournie)
    const firebaseConfig = {
      apiKey: "AIzaSyAPICbQrWgARovGaebUYYP-WwohxQAYtuw",
      authDomain: "programme-force.firebaseapp.com",
      projectId: "programme-force",
      storageBucket: "programme-force.firebasestorage.app",
      messagingSenderId: "1070910165788",
      appId: "1:1070910165788:web:8212aec95671abfbdb60d9"
    };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    /*************************
     * Helpers UI
     *************************/
    const $ = (id)=>document.getElementById(id);
    const screens = { login:$("screenLogin"), home:$("screenHome"), workout:$("screenWorkout") };
    function showScreen(name){
      Object.values(screens).forEach(s=>s.classList.remove("active"));
      screens[name].classList.add("active");
    }
    function setMsg(txt){ $("loginMsg").textContent = txt || ""; }

    /*************************
     * Theme
     *************************/
    const THEME_KEY = "coach_theme";
    function applyTheme(t){
      document.documentElement.setAttribute("data-theme", t);
      localStorage.setItem(THEME_KEY, t);
      const meta = document.querySelector('meta[name="theme-color"]');
      if(meta) meta.setAttribute("content", t==="light" ? "#f5f7fb" : "#0b0f17");
    }
    applyTheme(localStorage.getItem(THEME_KEY) || "dark");
    $("btnTheme").addEventListener("click", ()=>{
      const cur = document.documentElement.getAttribute("data-theme") || "dark";
      applyTheme(cur === "dark" ? "light" : "dark");
    });

    /*************************
     * Dynamic sessions loader (Option B)
     *************************/
    window.SESSIONS = null;

    function loadScriptOnce(src){
      return new Promise((resolve, reject)=>{
        if(document.querySelector(`script[data-dyn="${src}"]`)) return resolve();
        const s = document.createElement("script");
        s.src = src;
        s.async = true;
        s.setAttribute("data-dyn", src);
        s.onload = ()=>resolve();
        s.onerror = ()=>reject(new Error("Impossible de charger le fichier: " + src));
        document.head.appendChild(s);
      });
    }

    async function getUserConfig(uid){
      const ref = doc(db, `users/${uid}/profile/config`);
      const snap = await getDoc(ref);
      if(!snap.exists()){
        throw new Error("Config Firestore manquante: users/{uid}/profile/config");
      }
      return snap.data();
    }

    async function loadUserSessions(uid){
      const cfg = await getUserConfig(uid);

      const file = cfg.sessionsFile;
      const varName = cfg.sessionsVar;
      const displayName = cfg.displayName || "";

      if(!file || !varName) throw new Error("Config invalide: sessionsFile/sessionsVar");

      console.log("[PF] user config:", cfg);
      await loadScriptOnce(file);

      const obj = window[varName];
      if(!obj) throw new Error(`La variable window["${varName}"] est introuvable (mauvais sessionsVar ou fichier).`);

      window.SESSIONS = obj;

      $("userLine").textContent = displayName || "Connecté";
      $("homeHint").textContent = `Chargé: ${file} → ${varName}`;
      console.log("[PF] sessions loaded keys:", Object.keys(window.SESSIONS || {}));
    }

    /*************************
     * Home list
     *************************/
    function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[m])); }

    function renderHome(){
      const sessions = window.SESSIONS || {};
      const keys = Object.keys(sessions);

      const host = $("sessionList");
      host.innerHTML = "";

      if(keys.length === 0){
        host.innerHTML = `<div class="muted small">Aucune séance trouvée (SESSIONS vide).</div>`;
        return;
      }

      keys.forEach((k)=>{
        const s = sessions[k];
        const name = s?.name || k;
        const nWarmup = (s?.warmup||[]).length;
        const nItems = (s?.items||[]).length;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="sessionItem">
            <div class="grow">
              <div class="h2">${escapeHtml(name)}</div>
              <div class="muted small">${nWarmup} échauffement • ${nItems} exercices</div>
            </div>
            <button class="btn primary">Démarrer</button>
          </div>
        `;
        card.querySelector("button").addEventListener("click", ()=>startSession(k));
        host.appendChild(card);
      });
    }

    /*************************
     * Workout engine (simple)
     *************************/
    function setImg(iconKey){
      const map = window.IMG || {};
      const path = map[iconKey] || iconKey || "";
      $("exoImg").src = path;
    }

    let curSession = null;
    let seq = [];
    let idx = 0;

    let running = false;
    let timer = null;
    let remaining = 0;

    function mmss(sec){
      const s = Math.max(0, Math.floor(sec));
      const m = Math.floor(s/60);
      const r = s%60;
      return String(m).padStart(2,"0") + ":" + String(r).padStart(2,"0");
    }

    function stopTimer(){
      running = false;
      if(timer){ clearInterval(timer); timer=null; }
      $("btnPlayPause").textContent = "▶︎";
    }

    function startTimer(){
      if(running) return;
      running = true;
      $("btnPlayPause").textContent = "⏸";
      let lastTick = Date.now();

      timer = setInterval(()=>{
        const now = Date.now();
        const dt = (now - lastTick) / 1000;
        lastTick = now;
        remaining -= dt;

        if(remaining <= 0){
          clearInterval(timer); timer=null;
          running = false;
          $("btnPlayPause").textContent = "▶︎";
          stepNext();
          return;
        }
        $("timeText").textContent = mmss(remaining);
      }, 120);
    }

    function buildSequence(session){
      const out = [];
      (session.warmup || []).forEach((w)=> out.push({ type:"warmup", title:w.name, desc:w.desc || w.todo || "", icon:w.icon, seconds:w.seconds || 60 }));
      (session.items || []).forEach((e)=> {
        const sets = Number(e.sets || 1);
        const work = Number(e.work || e.seconds || 45);
        const rest = Number(e.rest || 60);
        for(let s=1; s<=sets; s++){
          out.push({ type:"work", exo:e, setIndex:s, setTotal:sets, seconds:work });
          if(s<sets) out.push({ type:"rest", exo:e, setIndex:s, setTotal:sets, seconds:rest });
        }
      });
      return out;
    }

    function renderStep(){
      stopTimer();
      const cur = seq[idx];
      if(!cur){
        showScreen("home");
        return;
      }

      $("workoutTitle").textContent = curSession?.name || "Séance";
      $("workoutSubtitle").textContent = cur.type === "warmup" ? "Échauffement" : (cur.type === "work" ? "Travail" : "Repos");

      if(cur.type === "warmup"){
        $("phasePill").textContent = "ÉCHAUFFEMENT";
        $("phaseHint").textContent = "▶︎ pour démarrer";
        $("setBadge").textContent = "Échauff.";
        $("exoName").textContent = cur.title || "Échauffement";
        $("exoDesc").textContent = cur.desc || "—";
        setImg(cur.icon || "");
      }else{
        const e = cur.exo || {};
        $("phasePill").textContent = (cur.type === "work") ? "EXERCICE" : "REPOS";
        $("phaseHint").textContent = "▶︎ pour lancer le timer";
        $("setBadge").textContent = `Série ${cur.setIndex}/${cur.setTotal}`;
        $("exoName").textContent = e.name || "Exercice";
        $("exoDesc").textContent = e.desc || e.muscle || "—";
        setImg(e.icon || "");
      }

      remaining = Number(cur.seconds || 0);
      $("timeText").textContent = mmss(remaining);
    }

    function startSession(sessionId){
      const sessions = window.SESSIONS || {};
      curSession = sessions[sessionId];
      if(!curSession) return;

      seq = buildSequence(curSession);
      idx = 0;

      showScreen("workout");
      renderStep();
    }

    function stepPrev(){ stopTimer(); idx = Math.max(0, idx-1); renderStep(); }
    function stepNext(){ stopTimer(); idx = Math.min(seq.length-1, idx+1); renderStep(); }

    $("btnPrev").addEventListener("click", stepPrev);
    $("btnNext").addEventListener("click", stepNext);
    $("btnPlayPause").addEventListener("click", ()=> running ? stopTimer() : startTimer() );
    $("btnBackHome").addEventListener("click", ()=>{ stopTimer(); showScreen("home"); });

    /*************************
     * Auth
     *************************/
    $("btnLogin").addEventListener("click", async ()=>{
      setMsg("");
      const email = $("loginEmail").value.trim();
      const pass  = $("loginPass").value;
      if(!email || !pass){ setMsg("Entre email + mot de passe."); return; }

      try{
        await signInWithEmailAndPassword(auth, email, pass);
      }catch(e){
        setMsg("Connexion impossible : " + (e?.message || e));
      }
    });

    $("btnLogout").addEventListener("click", async ()=>{
      try{ await signOut(auth); }catch(e){}
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        $("userLine").textContent = "Non connecté";
        $("pillStatus").textContent = "🔒";
        $("btnLogout").style.display = "none";
        showScreen("login");
        return;
      }

      $("pillStatus").textContent = "✅";
      $("btnLogout").style.display = "inline-flex";

      try{
        await loadUserSessions(user.uid);
        renderHome();
        showScreen("home");
      }catch(e){
        console.error(e);
        showScreen("login");
        setMsg("Erreur config/séances : " + (e?.message || e));
      }
    });

    /*************************
     * PWA / SW (si présent)
     *************************/
    if("serviceWorker" in navigator){
      navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
    }

    /*************************
     * iOS double-tap zoom guard
     *************************/
    let lastTouchEnd = 0;
    document.addEventListener("touchend", function (event) {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) event.preventDefault();
      lastTouchEnd = now;
    }, { passive:false });

  </script>
</body>
</html>
